# Synthetic-only example. Store the real file outside Git; chmod 0600.
# Unknown fields fail closed. Legacy embedded passwords are deliberately rejected.
profile:
  first_name: Synthetic
  last_name: Person
  email: person@example.invalid
email:
  provider: smtp
  from: person@example.invalid
  smtp:
    host: smtp.example.invalid
    port: 465
    username: person@example.invalid
    password_file: /run/secrets/smtp_password
    tls_mode: implicit # or starttls (usually port 587); no plaintext mode
options:
  dry_run: true
  template: generic
  rate_limit_ms: 2000
  regions: []
  excluded_brokers: []
  approved_brokers: {}
  # Approve only a verified, current recipient you intend to contact:
  # example-id:
  #   email: privacy@example.invalid
  #   fields: [name] # optional: email,address,city,state,zip_code,country,phone,date_of_birth
